<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Sprout Valley</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Pixelify+Sans:wght@500;700&display=swap">
<style>
/* Land tiers (Common to Mythical) scale fruit size; Fertilizer slot upgrades plots. Layout: one full-height screen. Top bar (Day left, sheckles right), weather strip, square garden centered in the remaining space, mission cards, then a bottom toolbar: item slots above five icon buttons (Well, Shop, Sell, Sell All, Goals). Shop, backpack and goals share one bottom sheet; locked land opens a small buy popup. */
:root {
  --bg: #13231a;
  --panel: #213628;
  --panel2: #2a4532;
  --hi: #3e6149;
  --edge: #0b150f;
  --ink: #f6efd8;
  --muted: #a8bba2;
  --gold: #ffc233;
  --gold-d: #a8761b;
  --water: #5bb6e8;
  --water-d: #2f7fb0;
  --leaf: #7ccc4c;
  --leaf-d: #4b8530;
  --xp: #b68cff;
  --xp-d: #6c43b8;
  --danger: #e8523f;
  --display: 'Pixelify Sans', ui-monospace, 'SF Mono', Menlo, monospace;
  --body: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; background: var(--bg); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--body);
  font-size: 15px;
  line-height: 1.4;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 8px;
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-tap-highlight-color: transparent;
}
.app { height: 100%; max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; min-height: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--water); outline-offset: 2px; }
.bevel { background: var(--panel); border: 2px solid var(--edge); border-radius: 4px; box-shadow: inset 2px 2px 0 var(--hi), inset -2px -2px 0 rgba(0,0,0,.35); }

/* top bar */
.hud { flex: none; display: flex; justify-content: space-between; align-items: stretch; gap: 10px; }
.day { display: flex; flex-direction: column; gap: 4px; padding: 5px 10px 6px; min-width: 0; flex: 0 1 auto; }
.day .d { display: flex; align-items: baseline; gap: 6px; font-family: var(--display); line-height: 1; }
.day .d small { font-size: 12px; letter-spacing: .1em; color: var(--muted); }
.day .d b { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
.lvrow { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.badge { width: 20px; height: 20px; flex: none; display: grid; place-items: center; background: var(--xp); color: #1d0f3a; border: 2px solid var(--edge); box-shadow: inset 1px 1px 0 #d9c4ff, inset -1px -1px 0 var(--xp-d); font-family: var(--display); font-weight: 700; font-size: 12px; }
.bar { height: 8px; width: 56px; background: var(--bg); border: 2px solid var(--edge); overflow: hidden; }
.bar > div { height: 100%; background: var(--xp); width: 0; transition: width .25s steps(6); }
.money { display: flex; align-items: center; gap: 8px; padding: 6px 14px; font-family: var(--display); font-size: 26px; font-variant-numeric: tabular-nums; min-width: 0; }
.money.pop { animation: pop .35s steps(4); }
@keyframes pop { 50% { transform: scale(1.1); } }
.coin { width: 18px; height: 18px; border-radius: 50%; background: var(--gold); box-shadow: inset -3px -3px 0 var(--gold-d), inset 0 0 0 2px #ffe08a; flex: none; display: inline-block; }

.weather { flex: none; position: relative; display: flex; flex-direction: row; align-items: center; gap: 10px; padding: 5px 10px 9px; border-left: 6px solid var(--wc, var(--water)); overflow: hidden; }
.weather > img { width: 28px; height: 28px; flex: none; image-rendering: pixelated; }
.wt { flex: 1; min-width: 0; }
.wt b { font-family: var(--display); font-size: 16px; font-weight: 700; }
.wt span { display: block; color: var(--muted); font-size: 11px; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wr { text-align: right; font-variant-numeric: tabular-nums; font-weight: 800; font-size: 14px; white-space: nowrap; }
.wr small { display: flex; align-items: center; gap: 4px; justify-content: flex-end; color: var(--muted); font-weight: 700; font-size: 11px; }
.wr small img { width: 14px; height: 14px; image-rendering: pixelated; }
.wbar { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: var(--bg); }
.wbar > div { height: 100%; background: var(--wc, var(--water)); }

/* garden */
.stage { flex: 1; min-height: 0; container-type: size; display: grid; place-items: center; }
.field { position: relative; width: 100%; aspect-ratio: 1; border: 4px solid var(--edge); border-radius: 4px; box-shadow: 0 4px 0 #070d09; background: #5eb040; overflow: hidden; }
@supports (width: 1cqw) { .field { width: min(100cqw, 100cqh); height: min(100cqw, 100cqh); aspect-ratio: auto; } }
.field.shake { animation: shake .28s steps(6); }
@keyframes shake { 20% { transform: translate(3px, -2px); } 40% { transform: translate(-3px, 2px); } 60% { transform: translate(2px, 1px); } 80% { transform: translate(-2px, -1px); } }
html.gfx canvas, html.gfx img, html.gfx .ico { image-rendering: auto !important; }
canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; touch-action: none; cursor: pointer; }
.fx { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.ft { position: absolute; transform: translate(-50%, -50%); font-family: var(--display); font-weight: 700; font-size: 14px; color: #fff; white-space: nowrap; text-shadow: 1px 1px 0 #000, -1px 1px 0 #000, 1px -1px 0 #000, -1px -1px 0 #000; animation: rise 1.25s steps(12) forwards; }
.ft.gold { color: var(--gold); }
.ft.big { font-size: 18px; }
.ft.blue { color: #8fd3ff; }
@keyframes rise { from { transform: translate(-50%, -50%); opacity: 1; } 70% { opacity: 1; } to { transform: translate(-50%, -260%); opacity: 0; } }
.combo { position: absolute; left: 6px; top: 6px; background: rgba(11,21,15,.82); border: 2px solid var(--gold); padding: 3px 9px 5px; font-family: var(--display); font-weight: 700; color: var(--gold); font-size: 15px; pointer-events: none; min-width: 92px; }
.combo .bar { width: auto; height: 5px; margin-top: 2px; border-width: 1px; }
.combo .bar > div { background: var(--gold); transition: none; }
.ibs { position: absolute; right: 6px; top: 6px; display: flex; gap: 6px; }
.ib { width: 34px; height: 34px; padding: 0; display: grid; place-items: center; background: rgba(11,21,15,.72); border: 2px solid var(--edge); border-radius: 4px; }
.ib:active { background: rgba(11,21,15,.95); }

/* mission cards */
.mcards { flex: none; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.mc { padding: 5px 7px 6px; display: flex; flex-direction: column; gap: 4px; min-width: 0; font-size: 12px; }
.mc.done { border-color: var(--leaf); }
.mc b { font-weight: 800; line-height: 1.2; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 2.4em; }
.mc .mbar { margin: 0; height: 7px; }
.mfoot { display: flex; justify-content: space-between; align-items: center; gap: 4px; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--gold); min-height: 22px; }
.mfoot span:first-child { color: var(--muted); }
.mc .buy { padding: 3px 7px; font-size: 12px; box-shadow: 0 2px 0 var(--gold-d); }

/* bottom toolbar */
.hotbar { flex: none; padding: 8px 8px calc(8px + env(safe-area-inset-bottom, 0px) * 0); display: flex; flex-direction: column; gap: 6px; }
.hl { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-weight: 800; font-size: 12px; min-width: 0; }
.hl #selName { color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.hl #canName { color: var(--water); white-space: nowrap; font-variant-numeric: tabular-nums; }
.hl small { color: var(--muted); margin-left: 4px; font-weight: 700; }
.meter { height: 8px; background: var(--bg); border: 2px solid var(--edge); overflow: hidden; }
.meter > div { height: 100%; background: var(--water); width: 0; transition: width .2s steps(5); }
.slots { display: flex; gap: 6px; overflow-x: auto; padding: 2px 0 4px; min-height: 64px; scrollbar-width: none; }
.slots::-webkit-scrollbar { display: none; }
.slot { position: relative; flex: none; width: 48px; height: 58px; background: var(--bg); border: 2px solid var(--edge); border-radius: 4px; display: grid; place-items: center; padding: 0; }
.slot[aria-pressed="true"] { border-color: var(--gold); box-shadow: 0 0 0 2px rgba(255,194,51,.35); background: #1c3324; }
.slot.shovel[aria-pressed="true"] { border-color: var(--danger); box-shadow: 0 0 0 2px rgba(232,82,63,.35); }
.slot .n { position: absolute; right: 2px; bottom: 0; font: 800 12px var(--body); color: var(--gold); text-shadow: 1px 1px 0 #000, -1px 1px 0 #000; font-variant-numeric: tabular-nums; }
.slots .empty { align-self: center; margin: 0; font-size: 12px; color: var(--muted); padding: 0 4px; }
.acts { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; }
#profAv { display: block; line-height: 0; height: 36px; display: flex; align-items: center; justify-content: center; }
.reveal.house { z-index: 74; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 8px; padding: 10px 10px calc(10px + env(safe-area-inset-bottom, 0px)); background: #1a1410; overflow: hidden; }
.hs-head { width: min(96vw, 520px); display: flex; flex-direction: column; gap: 2px; } .hs-head b { font: 800 18px var(--body); color: #ffd34d; } .hs-head span { font: 700 11px var(--body); color: #cdbfa0; }
.hs-stage { width: min(96vw, 520px); flex: 1 1 auto; min-height: 0; display: grid; place-items: center; } #hsCv { position: static; left: auto; top: auto; z-index: auto; width: 100%; height: auto; max-width: none; border: 4px solid #5a4030; border-radius: 6px; image-rendering: pixelated; background: #000; touch-action: none; }
.hs-inv { width: min(96vw, 520px); min-height: 62px; display: flex; gap: 6px; overflow-x: auto; align-items: center; padding: 4px; background: #261c14; border: 2px solid #5a4030; border-radius: 6px; }
.hs-it { flex: none; display: grid; justify-items: center; gap: 2px; background: #3a2a1e; border: 2px solid #5a4030; border-radius: 4px; padding: 3px 6px; color: #fff; cursor: pointer; } .hs-it.on { border-color: #ffd34d; box-shadow: 0 0 10px #ffd34d; } .hs-it img { max-width: 48px; max-height: 34px; image-rendering: pixelated; } .hs-it small { font: 700 9px var(--body); }
.hs-hint { font: 700 11px var(--body); color: #cdbfa0; padding: 0 6px; }
.hs-tools { width: min(96vw, 520px); display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; } .hs-tools .act.sel { border-color: #ffd34d; box-shadow: 0 0 10px #ffd34d, 0 3px 0 var(--edge); }
.hs-panel { position: absolute; inset: 0; background: rgba(16,10,6,.97); display: flex; flex-direction: column; align-items: center; padding: 12px; gap: 8px; overflow: hidden; } .hs-panel[hidden] { display: none; }
.hs-ph { width: min(96vw, 520px); display: flex; justify-content: space-between; align-items: center; } .hs-ph b { font: 800 18px var(--body); color: #ffd34d; }
.hs-cats { width: min(96vw, 520px); display: flex; gap: 5px; flex-wrap: wrap; } .hs-list { width: min(96vw, 520px); flex: 1; overflow: auto; display: grid; gap: 6px; align-content: start; }
.hs-ic { width: 52px; height: 40px; object-fit: contain; image-rendering: pixelated; flex: none; } .hs-sw { width: 40px; height: 40px; border: 2px solid var(--edge); flex: none; }
.reveal.prof { z-index: 75; }
.pf { max-width: 460px; }
.pf-hero { display: flex; align-items: center; gap: 14px; } .pf-name { font: 800 22px var(--body); color: #fff; } .pf-rank { font: 700 12px var(--body); color: #ffd34d; }
.pf-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; width: 100%; } .pf-stats div { background: #0f2118; border: 2px solid var(--edge); border-radius: 6px; padding: 6px 2px; text-align: center; display: grid; } .pf-stats b { font: 800 13px var(--body); color: #fff; } .pf-stats span { font: 700 9px var(--body); color: #9fb8a6; }
.pf-note { font: 600 11px/1.35 var(--body); color: #b8cdbd; text-align: center; max-width: 420px; }
.pf-card { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px; border: 2px solid var(--edge); border-radius: 8px; background: #0f2118; } .pf-info { flex: 1; display: grid; gap: 4px; text-align: left; font: 600 11px/1.3 var(--body); color: #cfe0d4; } .pf-info b { font-size: 14px; color: #fff; } .pf-info em { margin-left: 8px; font-style: normal; font-size: 10px; background: #ffd34d; color: #2a1a00; padding: 1px 6px; border-radius: 6px; }
.pf-bar { height: 8px; background: #0b150f; border: 1px solid var(--edge); border-radius: 4px; overflow: hidden; } .pf-bar i { display: block; height: 100%; background: linear-gradient(90deg, #7be67b, #ffd34d); }
.pf-btns { display: flex; gap: 10px; }
.act { position: relative; background: var(--panel2); border: 2px solid var(--edge); border-radius: 4px; box-shadow: 0 3px 0 var(--edge), inset 2px 2px 0 var(--hi); padding: 5px 2px 4px; display: flex; flex-direction: column; align-items: center; gap: 1px; min-width: 0; }
.act:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--edge), inset 2px 2px 0 var(--hi); }
.act .lb { font: 800 11px var(--body); color: var(--ink); white-space: nowrap; }
.act small { font: 800 10px var(--body); color: var(--muted); min-height: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.act.sellall small { color: var(--gold); }
.dot { position: absolute; top: -7px; right: -5px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px; background: var(--danger); color: #fff; font: 800 12px var(--body); display: grid; place-items: center; border: 2px solid var(--edge); }
.dot.gray { background: var(--panel2); color: var(--ink); }

.act [data-ic] { display: block; line-height: 0; }
.ico { display: block; flex: none; image-rendering: pixelated; }
.ico.sm { width: 30px; height: 39px; }
.ico.lg { width: 40px; height: 52px; }
.ico.fr { width: 36px; height: 36px; }
.ico.tr { width: 32px; height: 32px; }
.ico.pt { width: 48px; height: 48px; }
#petStop { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); z-index: 12; background: #1d3a2a; color: #fff; border: 2px solid var(--edge); border-radius: 4px; box-shadow: inset 2px 2px 0 var(--hi); padding: 6px 12px; font: 700 12px var(--body); cursor: pointer; }
#phase { position: fixed; top: 54px; left: 50%; transform: translateX(-50%); z-index: 12; padding: 4px 11px; border-radius: 12px; background: rgba(10,18,14,.82); border: 2px solid var(--edge); font: 700 11px var(--body); color: #fff; pointer-events: none; white-space: nowrap; transition: opacity .7s ease; }
#rushPill { position: fixed; top: 82px; left: 50%; transform: translateX(-50%); z-index: 12; padding: 4px 11px; border-radius: 12px; background: linear-gradient(90deg, #5a2a8a, #b8602a); border: 2px solid #ffd34d; font: 800 11px var(--body); color: #fff; pointer-events: none; white-space: nowrap; animation: nglow 1.2s ease-in-out infinite; } #rushPill[hidden] { display: none; }
#phase.night { background: #1a1040; border-color: #8a5aff; color: #e2d6ff; animation: nglow 2s ease-in-out infinite; }
@keyframes nglow { 50% { box-shadow: 0 0 14px #8a5aff; } }
body.idle #phase { opacity: .25; }
#petStop.off, #crewStop.off { background: #5a2430; }
#crewStop { position: fixed; top: 10px; left: 50%; transform: translateX(4px); z-index: 12; background: #1d3a2a; color: #fff; border: 2px solid var(--edge); border-radius: 4px; box-shadow: inset 2px 2px 0 var(--hi); padding: 6px 12px; font: 700 12px var(--body); cursor: pointer; }
#petStop { transform: translateX(calc(-100% - 4px)); }
.pbar { height: 6px; background: #0b150f; border: 1px solid var(--edge); margin-top: 4px; } .pbar i { display: block; height: 100%; background: var(--xp); }
.ico.ia { width: 36px; height: 36px; }
.ico.ib { width: 28px; height: 28px; }

.banner { position: fixed; left: 50%; top: calc(14px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 40; background: var(--panel); border: 3px solid var(--gold); box-shadow: 0 4px 0 rgba(0,0,0,.6); padding: 10px 18px; border-radius: 4px; text-align: center; width: max-content; max-width: calc(100% - 32px); animation: drop .35s steps(5); pointer-events: none; }
.banner b { display: block; font-family: var(--display); font-size: 22px; color: var(--gold); }
.banner span { font-weight: 700; font-size: 14px; }
.banner.weather-b { border-color: var(--water); }
.banner.weather-b b { color: var(--water); }
.banner.ach b { color: var(--xp); }
.banner.ach { border-color: var(--xp); }
@keyframes drop { from { transform: translate(-50%, -40px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }

/* sheet (shop, backpack, goals) */
#shop { position: fixed; inset: 0; z-index: 20; background: rgba(5, 10, 7, .72); display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 580px; max-height: 88%; background: var(--panel); border: 3px solid var(--edge); border-bottom: 0; border-radius: 8px 8px 0 0; display: flex; flex-direction: column; padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: max(0px, env(safe-area-inset-left, 0px)); padding-right: max(0px, env(safe-area-inset-right, 0px)); }
.sheet-head { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px 8px; }
.sheet-head h2 { margin: 0; font-family: var(--display); font-size: 22px; }
.close { background: var(--bg); border: 2px solid var(--edge); border-radius: 4px; padding: 6px 12px; font-weight: 800; }
.tabs { flex: none; display: flex; gap: 6px; padding: 0 16px 10px; overflow-x: auto; }
.tab { background: var(--bg); border: 2px solid var(--edge); border-radius: 4px; padding: 7px 14px; font-weight: 800; color: var(--muted); white-space: nowrap; }
.tab[aria-selected="true"] { color: #2a1d05; background: var(--gold); border-color: var(--gold-d); }
.sheet-body { overflow-y: auto; padding: 4px 16px 16px; display: flex; flex-direction: column; gap: 10px; }
.restock { display: flex; justify-content: space-between; gap: 12px; color: var(--muted); font-weight: 700; font-size: 13px; }
.restock b { color: var(--ink); font-variant-numeric: tabular-nums; }
.row { display: flex; align-items: center; gap: 12px; background: var(--bg); border: 2px solid var(--edge); border-radius: 4px; padding: 10px 12px; }
.row.out { opacity: .55; }
.row.ready { border-color: var(--gold); }
.row .info { flex: 1; min-width: 0; }
.row .info b { display: block; font-weight: 800; }
.row .info span { display: block; color: var(--muted); font-size: 13px; }
.row .info .tag { display: inline; }
.row .btns { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.tag { font-weight: 800; font-size: 12px; letter-spacing: .04em; text-transform: uppercase; margin-left: 6px; }
.buy { border: 0; border-radius: 4px; padding: 8px 10px; font-weight: 800; background: var(--gold); color: #2a1d05; box-shadow: 0 3px 0 var(--gold-d); font-variant-numeric: tabular-nums; }
.buy:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 var(--gold-d); }
.buy:disabled { opacity: .4; cursor: not-allowed; }
.mbar { height: 8px; background: #0b150f; border: 2px solid var(--edge); margin-top: 4px; overflow: hidden; }
.mbar > div { height: 100%; background: var(--leaf); }
.section-title { font-family: var(--display); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-top: 4px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.maxed { color: var(--leaf); font-weight: 800; }
.pips { display: flex; gap: 4px; margin-top: 4px; }
.pips i { width: 14px; height: 14px; background: var(--bg); border: 2px solid var(--edge); }
.pips i.on { background: var(--gold); border-color: var(--gold-d); }
.pips i.nx { border-color: var(--gold); }
.reset { align-self: flex-start; background: none; border: 0; color: var(--muted); text-decoration: underline; padding: 4px 0; font-size: 13px; }

/* land popup */
.modal { position: fixed; inset: 0; z-index: 25; background: rgba(5, 10, 7, .72); display: grid; place-items: center; padding: 16px; }
.card { width: 100%; max-width: 340px; background: var(--panel); border: 3px solid var(--edge); border-radius: 6px; box-shadow: inset 2px 2px 0 var(--hi); padding: 16px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
.card h3 { margin: 0; font-family: var(--display); font-size: 22px; }
.card p { margin: 0; color: var(--muted); }
.card .cost { display: flex; align-items: center; gap: 8px; font-family: var(--display); font-size: 24px; }

  var LOGV = [
    { v: '3.8', d: 'Nov 10, 2026', t: 'Art Upgrade and Fixes', c: ['All the pixel art got an upgrade: crops, plants, characters, pets, items and icons now have richer colors, top-down lighting, cool shadows and dithered shading. Still fully pixelated.', 'Buttons you add to the top bar or toolbar now use the exact same icons as the bottom bar (including your character on Profile).', 'Fixed a bug where editing the toolbar after adding a top bar could break the bottom bar.', 'The save code now also keeps your intro and display settings, not just your game and layout.', 'New Graphics level setting (Settings, Look and feel): Classic, Enhanced or Ultra pixel art for every plant, seed, icon and character. Ultra has the richest shading, warm highlights, cool shadows and colored outlines. Realistic adds 3D volume shading, material grain and a cinematic vignette on top.', 'Beta: new 3D mode makes every pixel sprite a raised voxel-style block with depth, lit from the upper left. Ultra 3D goes further with a real 3D scene: tilted perspective camera and upright voxel plants, trees and characters, with lighting. Every sprite is now a chunky volumetric 3D model, and in Ultra 3D you can hold the new turn button next to the zoom buttons to orbit the camera, and tap the tilt button to change the camera height.', 'Beta, Ultra 3D: trees, bushes, rocks and flowers around the garden are now real 3D models with a 3D loading screen. New Control your player option: walk your character with WASD, arrow keys or the on-screen stick, the camera follows you and walking over ripe crops harvests them. New WebXR option adds a VR button to enter the garden with a VR headset. Both are saved in Settings and in your save code.', 'VR is now fully first person: you see two blocky arms that follow your controllers, and your game menu (shop, tools, sell all, refill water, pets, people, home) sits on your left or right arm, your choice in Beta settings. Point at it with your other hand and pull the trigger, or point at the ground to plant, water and harvest. Left stick walks, right stick turns.', 'Ultra 3D world is now endless: trees, bushes, rocks and flowers keep going in every direction as you walk (up to about 60 tiles past your garden, and only nearby scenery is drawn to keep it fast), with no copies of the flat 2D game. Your garden stays clear, and the land fills in around it if you expand.', 'New Extension Shop (Settings, Extensions): install premade themes and panels, or write your own with JavaScript in developer mode. Extensions run in a locked sandbox and can only read your game. Cheat Guard scans code, blocks anything that touches your save or tries to add coins, and bans extensions that try. Installed extensions are saved in your save code.', 'VR: both controllers now shoot a laser. Point it at the ground to see the tile, pull the trigger to plant, water or harvest. The arm menu now has Sell one, Profile and Goals, shop rows show their buy buttons, and pop-up messages appear on your arm so the whole game is playable in VR.', 'VR grabbing: squeeze the grip while pointing at a ripe crop to pick it up. Move your hand to the backpack behind your shoulder and let go to store it in your inventory, or let go anywhere else to drop it (grab it again from the ground, and anything left lying around goes to your backpack when you exit VR). Other buttons: thumbstick click = next tool, A or X = sell all, B or Y = open or close the shop.'] },
    { v: '3.7', d: 'Nov 9, 2026', t: 'Slot Machine Deluxe and Look and Feel', c: ['New players get a short tutorial the first time they launch the game. Replay it any time in Settings, About.', 'The pack slot machine is way better: a glowing cabinet with chasing lights, a lever to pull, blurred spinning reels, near-miss suspense, jackpot rays, coin rain, screen flashes and a staggered card reveal. Tap to skip.', 'New Look and feel section in Settings: Icons only toolbar (no backgrounds, just icons), button labels, icon size, 5 color themes, corner style, 3 fonts, see-through panels, short or full numbers, hide the hint line, haptics and a reset button.', 'Custom toolbar: add, remove and reorder the buttons on your toolbar. Put Home or any shop tab (Pets, Packs, Crew...) right on it. Inside the shop, tap Pin to add that tab as a shortcut. Edit it in Settings, Look and feel, Toolbar shortcuts.', 'New People working / People paused button at the top, right next to the Pets button. Pause you and every helper, then resume any time. Also in Settings, Gameplay.', 'Your look and toolbar are now included in the save code.', 'Layout customization: a second Top shortcut bar, show or hide any part of the top bar (money, goals, weather, buttons, timer) or hide it all. A settings gear shows up automatically if you remove every way to reach Settings.'] },
    { v: '3.6', d: 'Nov 9, 2026', t: '2 PM Rush', c: ['Every day at 2 PM (your local time) a 10 minute event starts while the game is open.', 'Saturdays: Seed Storm. Tons of good seeds rain down, with rare to Transcendent odds.', 'Every other day: Mutation Frenzy. Your whole garden gets hit with mutations over and over.', 'You get a heads up 5 minutes before, and a timer shows while it runs. Check the Events tab for the next one.'] },
    { v: '3.5', d: 'Nov 9, 2026', t: 'Home Sweet Home', c: ['New Home button (little house icon) next to the zoom buttons. Home is a side feature that opens its own screen with its own Sims-style toolbar.', 'Your crew has to go to bed at night. They sleep in your Home, and beds give a Rested speed boost in the morning. Better beds give a longer boost. Give someone coffee to keep them working all night.', 'Furniture Shop with 8 beds, seating, tables and lots of decor, plus floors and wall colors. Move, store and place furniture, and upgrade from a Studio up to a Mansion.'] },
